# GSO 光熱費シミュレーターを GitHub Pages で公開する。
# 公開先は https://kishii0005-collab.github.io/baroque-works/ 。
# 初回だけ、リポジトリの Settings > Pages > Source を「GitHub Actions」にしておく必要がある。
name: gso-eco-sim pages
# 公開するかどうかの判断が出るまでは、手動で起動したときだけ動く（自動では公開しない）。
# 公開すると決めたら、下の push のコメントを外す。
on:
  # push:
  #   branches: [claude/find-skills-2di27h]
  #   paths:
  #     - gso-eco-sim/**
  #     - .github/workflows/gso-eco-sim-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gso-eco-sim
      - id: deployment
        uses: actions/deploy-pages@v4
