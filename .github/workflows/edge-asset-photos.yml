# Downloads the Edge Asset site photos into edge-asset/img/ and rebuilds the pages,
# so the site serves its own copies instead of hot-linking Unsplash.
name: edge-asset photos
on:
  push:
    paths:
      - edge-asset/fetch_photos.sh
      - edge-asset/fetch_photos_browser.py
      - .github/workflows/edge-asset-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download photos with a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python edge-asset/fetch_photos_browser.py -MVSfkR4xz4 4UVtFIfK1eo 4mEyvORkbN0 GpJ9p1QH7O4 Q6sCJFHCubc TJ4CndIc9z8 a8A-z_ZPEC0 pcYN7Pi8_BQ q1tyQip5AQQ rD28m9BmXVs
      - name: Fill gaps, resize and rebuild
        run: bash edge-asset/fetch_photos.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-asset
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Edge Asset site: self-host photos in edge-asset/img"
          git push
