# When photo files are added to edge-asset/img/ (e.g. uploaded through the GitHub web UI
# as {photo-id}.jpg), rebuild the Edge Asset pages so they use the local copies first.
name: edge-asset photos
on:
  push:
    paths:
      - edge-asset/img/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resize photos and rebuild pages
        working-directory: edge-asset
        run: |
          if ls img/*.jpg >/dev/null 2>&1; then mogrify -resize "2000x>" -quality 80 -strip img/*.jpg; fi
          ls -la img
          python3 build.py index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-asset
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Edge Asset site: rebuild pages with self-hosted photos"
          git push
